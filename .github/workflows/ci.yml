name: CI Grupo J

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js e pnpm
        uses: pnpm/setup@v1
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false

      - name: Instalar Dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar Vulnerabilidades Conhecidas de Produção
        run: pnpm audit --prod --audit-level high

      # Existing formatting debt is reported without stopping security tests.
      - name: Verificação de Formatação (informativa)
        continue-on-error: true
        run: pnpm format:check

      - name: Lint de Código
        run: pnpm lint

      - name: Typecheck TypeScript Strict
        run: pnpm typecheck

      - name: Testes Unitários e de Integração
        run: pnpm test

      - name: Build das Aplicações Web
        run: pnpm build
